<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ccpulse">
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1c3566"/>
      <stop offset="1" stop-color="#0a1330"/>
    </linearGradient>
    <linearGradient id="m-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f7fe0"/>
      <stop offset="1" stop-color="#7cc8ff"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#m-bg)"/>
  <!-- the cycle: a ring with the "now" dot orbiting it -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4"/>
  <circle cx="64" cy="64" r="42" fill="none" stroke="#7cc8ff" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="185 264" transform="rotate(-90 64 64)"/>
  <circle cx="24.1" cy="77" r="8" fill="#ff8a5c" stroke="#0e1a3c" stroke-width="3"/>
  <!-- usage by hour -->
  <g fill="url(#m-bar)">
    <rect x="41" y="62" width="9" height="22" rx="4.5"/>
    <rect x="54" y="50" width="9" height="34" rx="4.5"/>
    <rect x="67" y="40" width="9" height="44" rx="4.5"/>
  </g>
  <rect x="80" y="56" width="9" height="28" rx="4.5" fill="#ffffff"/>
</svg>
